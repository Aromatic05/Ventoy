name: Ventoy CI

on:
  push:
    branches: [ "ventoy-local" ]
  pull_request:
    branches: [ "ventoy-local" ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run docker compose up
      run: docker compose up
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy
        path: INSTALL/ventoy*.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: SHA256SUM
        path: INSTALL/sha256.txt
    - uses: actions/upload-artifact@v4
      with:
        name: xxx-build-log
        path: DOC/build.log
