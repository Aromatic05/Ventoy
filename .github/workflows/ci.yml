name: Ventoy CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run docker compose up
      run: docker compose up
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy-pack
        path: INSTALL/ventoy-*.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: SHA256SUM
        path: INSTALL/sha256.txt
    - uses: actions/upload-artifact@v4
      with:
        name: ventoy-build-log
        path: DOC/build.log
